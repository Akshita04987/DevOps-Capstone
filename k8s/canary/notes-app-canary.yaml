apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app-canary
  namespace: notes
  labels:
    app: notes-app
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-app
      track: canary
  template:
    metadata:
      labels:
        app: notes-app
        track: canary
    spec:
      serviceAccountName: notes-app
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: postgres:16
          command: ["sh", "-c", "until pg_isready -h db -p 5432; do echo waiting for db; sleep 2; done"]
      containers:
        - name: app
          image: ghcr.io/akshita04987/devops-capstone:sha-c91e6f7
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: notes-config
          env:
            - name: APP_VERSION
              value: "v2"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: database
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
