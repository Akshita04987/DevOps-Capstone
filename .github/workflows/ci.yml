name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test and dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt

      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt pip-audit

      - name: Lint
        run: flake8 app --max-line-length=150

      - name: Unit tests
        run: cd app && SKIP_DB_INIT=1 pytest -q

      - name: Dependency vulnerability scan
        run: pip-audit -r app/requirements.txt

  integration:
    name: Integration test with Docker Compose
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait until the app is ready
        run: |
          for i in $(seq 1 30); do
            if curl -fs localhost:5000/ready; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Smoke test
        run: |
          curl -fs localhost:5000/health
          curl -fs -X POST localhost:5000/api/notes -H "Content-Type: application/json" -d '{"text":"ci note"}'
          curl -fs localhost:5000/api/notes | grep "ci note"

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: [test, integration]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
