<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Notes</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    li { margin: 6px 0; }
    small { color: #666; }
    .v { background: #1F3864; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Notes <span class="v">{{ version }}</span></h1>
  <form id="f">
    <input id="t" placeholder="Write a note" required style="width:70%">
    <button>Add</button>
  </form>
  <ul id="list"></ul>
  <script>
    async function load() {
      const r = await fetch('/api/notes');
      const data = await r.json();
      const ul = document.getElementById('list');
      ul.innerHTML = '';
      data.forEach(function (n) {
        const li = document.createElement('li');
        li.textContent = n.text + '  (' + n.created_at + ')';
        ul.appendChild(li);
      });
    }
    document.getElementById('f').addEventListener('submit', async function (e) {
      e.preventDefault();
      const input = document.getElementById('t');
      await fetch('/api/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: input.value })
      });
      input.value = '';
      load();
    });
    load();
  </script>
</body>
</html>
