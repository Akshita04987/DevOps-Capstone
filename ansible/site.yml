- name: Prepare the workstation and deploy the notes platform
  hosts: local
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    kind_version: v0.33.0

  tasks:
    - name: Check that Docker and Terraform are available
      ansible.builtin.command: "which {{ item }}"
      loop: [docker, terraform]
      changed_when: false
      tags: [tools]

    - name: Install kind
      ansible.builtin.get_url:
        url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-amd64"
        dest: /usr/local/bin/kind
        mode: "0755"
      tags: [tools]

    - name: Check whether kubectl is installed
      ansible.builtin.stat:
        path: /usr/local/bin/kubectl
      register: kubectl_bin
      tags: [tools]

    - name: Find the latest stable kubectl version
      ansible.builtin.uri:
        url: https://dl.k8s.io/release/stable.txt
        return_content: true
      register: kubectl_stable
      when: not kubectl_bin.stat.exists
      tags: [tools]

    - name: Install kubectl
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_stable.content | trim }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"
      when: not kubectl_bin.stat.exists
      tags: [tools]

    - name: Check that Terraform created the database secret
      ansible.builtin.command: kubectl -n notes get secret db-credentials
      changed_when: false
      tags: [deploy]

    - name: Deploy the database
      ansible.builtin.command: "kubectl apply -f {{ repo_root }}/k8s/10-postgres.yaml"
      register: db_apply
      changed_when: "' created' in db_apply.stdout"
      tags: [deploy]

    - name: Deploy the application
      ansible.builtin.command: "kubectl apply -f {{ repo_root }}/k8s/20-app.yaml"
      register: app_apply
      changed_when: "'created' in app_apply.stdout or 'configured' in app_apply.stdout"
      tags: [deploy]

    - name: Wait for the database to be ready
      ansible.builtin.command: kubectl -n notes rollout status statefulset/postgres --timeout=240s
      changed_when: false
      tags: [deploy]

    - name: Wait for the application to be ready
      ansible.builtin.command: kubectl -n notes rollout status deployment/notes-app --timeout=240s
      changed_when: false
      tags: [deploy]

    - name: Smoke test the application
      ansible.builtin.uri:
        url: http://localhost:8080/health
        status_code: 200
      register: health
      retries: 20
      delay: 3
      until: health.status == 200
      tags: [deploy]

    - name: Install Helm
      ansible.builtin.shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm
      tags: [tools]

    - name: Add Helm repositories
      ansible.builtin.command: "helm repo add {{ item.name }} {{ item.url }} --force-update"
      loop:
        - { name: prometheus-community, url: "https://prometheus-community.github.io/helm-charts" }
        - { name: grafana, url: "https://grafana.github.io/helm-charts" }
      changed_when: false
      tags: [monitoring]

    - name: Install Prometheus and Grafana
      ansible.builtin.command: >
        helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack
        --namespace monitoring --values {{ repo_root }}/monitoring/kube-prometheus-stack-values.yaml
        --wait --timeout 10m
      register: kps
      changed_when: "'REVISION: 1' in kps.stdout"
      tags: [monitoring]

    - name: Install Loki
      ansible.builtin.command: "kubectl apply -f {{ repo_root }}/monitoring/loki.yaml"
      register: loki_apply
      changed_when: "' created' in loki_apply.stdout"
      tags: [monitoring]

    - name: Install the Alloy log collector
      ansible.builtin.command: >
        helm upgrade --install alloy grafana/alloy
        --namespace monitoring --values {{ repo_root }}/monitoring/alloy-values.yaml
        --wait --timeout 5m
      register: alloy
      changed_when: "'REVISION: 1' in alloy.stdout"
      tags: [monitoring]

    - name: Apply the app monitor, alert rules and dashboard
      ansible.builtin.command: "kubectl apply -f {{ repo_root }}/monitoring/notes-observability.yaml"
      register: obs_apply
      changed_when: "' created' in obs_apply.stdout"
      tags: [monitoring]

    - name: Check that Prometheus is ready
      ansible.builtin.uri:
        url: http://localhost:9090/-/ready
        status_code: 200
      register: prom
      retries: 20
      delay: 5
      until: prom.status == 200
      tags: [monitoring]
